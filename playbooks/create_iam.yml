- name: Create IAM Roles for EKS
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - community.aws

  vars_files:
    - ../vars/main.yml

  tasks:
    - name: Create EKS Cluster Role
      iam_role:
        name: "{{ cluster_role_name }}"
        assume_role_policy_document: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Service": "eks.amazonaws.com" },
                "Action": "sts:AssumeRole"
              }
            ]
          }
        managed_policy:
          - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        state: present

    - name: Attach inline PassRole policy to Cluster Role
      iam_policy:
        iam_type: role
        iam_name: "{{ cluster_role_name }}"
        policy_name: "AllowPassNodeRole"
        state: present
        policy_json: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "iam:GetRole",
                  "iam:PassRole"
                ],
                "Resource": "arn:aws:iam::{{ account_id }}:role/{{ node_role_name }}"
              }
            ]
          }


    - name: Create EKS Node Group Role
      iam_role:
        name: "{{ node_role_name }}"
        assume_role_policy_document: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {
                  "Service": [
                    "ec2.amazonaws.com"
                  ]
                },
                "Action": "sts:AssumeRole"
              }
            ]
          }
        managed_policy:
          - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
          - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
          - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        state: present
      register: node_role_output

    - name: Set Node Role ARN fact
      set_fact:
        node_role_arn: "{{ node_role_output.iam_role.arn }}"

